# Alembic configuration for the GeoMemory backend.
# Run from backend/ (or inside the image, WORKDIR /app):  alembic upgrade head
# The database URL is NOT set here: migrations/env.py reads DATABASE_URL through app.config.

[alembic]
# Migration scripts, relative to this file.
script_location = %(here)s/migrations

# Import path for "app" (the directory of this file), split by path_separator.
prepend_sys_path = %(here)s
path_separator = os

# Revision files are named <rev>_<slug>.py
# file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Keep generated revisions lint-clean (ruff is in the dev dependency group).
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging (used by migrations/env.py). SQL statements are not logged; the URL is never logged.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
