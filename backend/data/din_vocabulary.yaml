# Multilingual main-component nouns -> DIN 4023 codes (the case-sensitive keys of
# assets/din4023_patterns/din_codes.json; two contain "ö"). Read by normalize.lithology.din_code_from_text
# to fill `din4023_code` with method=derived when the extractor gave none. Generic; no document is named.
#
# Only NOUNS are listed. Adjectives (sandig, sandy, sableux, arenoso, zandig, sabbioso ...) name secondary
# components and are deliberately absent, so "Sand, kiesig" and "gravelly SAND" both give S.
# Terms are matched as whole words (or word sequences), case-insensitively, without stripping accents.
# Languages: de, en, fr, es, pt, nl, no (Norwegian), sv, da, it. A term that means different codes in
# different languages ("klei": Kl in German, clay in Dutch) is used only when the language is known.
