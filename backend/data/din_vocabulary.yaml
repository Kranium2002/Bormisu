# Size words next to a main noun narrow it to a fraction ("fine SAND" -> fS, "sable fin" -> fS,
# "fine to coarse SAND" -> S). Fraction codes per base code:
fractions:
  S: { fine: fS, medium: mS, coarse: gS }
  G: { fine: fG, medium: mG, coarse: gG }
  U: { coarse: gU }
fraction_words:
  fine: [fine, fein, fin, fine, fina, fino, fijn, fint]
  medium: [medium, mittel, moyen, moyenne, media, medio, média, médio, middel, midden, mellan, mellem, middels]
  coarse: [coarse, grob, grossier, grossière, gros, gruesa, grueso, grossa, grosso, grof, grov]
# Words between two fraction words that make a span ("fine to medium").
fraction_range_words: [to, bis, à, a, até, tot, till, til, e, und, and, et, y, og, och]
# A fraction word followed by one of these describes density or consistency, not grain size
# ("medium dense SAND").
fraction_blockers: [dense, loose, stiff, firm, soft, hard, strong, weak, compact, dicht, locker, steif,
                    weich, fest, dense, lâche, compacte, densa, denso, suelta, suelto, compacta, compacto,
                    rija, mole, compacta, vast, los, fast, löst, fast, fasta, sciolto, addensato]

# Nouns after one of these words are secondary components ("CLAY with sand", "Ton mit Steinen"), up to
# the next ";" or ".". Main components are the nouns outside such clauses; when they name two different
# codes ("SAND and GRAVEL", "Sand, Kies") there is no single main component and no code is derived
# (unless capitals mark one of them, BS 5930 style: "gravelly SAND", or a priority code applies).
with_words: [with, some, trace, traces, occasional, mit, vereinzelt, avec, con, com, met, med, à, sowie,
             including, inkl, einschließlich, contenant, conteniendo, contendo, incl]
# Codes that win over soil nouns outside a "with" clause: "FILL: sandy gravel" is fill.
priority_codes: [A, Mu]
# Languages that write compounds as one word: a word ending in a listed noun of that language counts
# as that noun when the remaining prefix has at least `compound_min_prefix` letters
# ("Quarzsand" -> S, "Kalksandstein" -> Sst). Used only when the description language is known.
compound_languages: [de, nl, "no", sv, da]
compound_min_prefix: 3
# DIN notation printed instead of words ("G, s, u'"): the main code first, then lower-case secondary
# codes optionally marked weak (') or strong (*, ¯, ̅).
notation_secondary_pattern: "^[a-zäöü]{1,3}['’*¯̅]?$"
