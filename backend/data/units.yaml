# Sign conventions (regular expressions, case-insensitive): a note saying negative values denote depth,
# or saying depths are positive downwards.
negative_down_patterns:
  - 'negative\s+(values?|numbers?|figures?|depths?|levels?|readings?)\s+(denote|indicate|represent|are|mean|show|signify|refer to)\s+(the\s+)?(depths?|below|down)'
  - '(depths?|values?)\s+(are|is)\s+(given|shown|expressed|presented|recorded|plotted)\s+as\s+negative'
  - 'negative\s*(=|:)\s*(below|down|depth)'
  - 'negative\s+downwards?'
  - 'positive\s+upwards?'
  - 'negative\s+werte\s+.{0,40}(tiefe|unter)'
  - 'tiefen?\s+.{0,30}negativ'
  - 'nach\s+unten\s+negativ'
  - 'valeurs\s+n[ée]gatives\s+.{0,40}(profondeur|sous)'
  - 'profondeurs?\s+.{0,30}n[ée]gati'
  - 'valores\s+negativos\s+.{0,40}(profundidad|profundidade|bajo|abaixo)'
  - 'profundidad(es)?\s+.{0,30}negativ'
  - 'profundidades?\s+.{0,30}negativ'
  - 'negatieve\s+waarden\s+.{0,40}(diepte|onder)'
  - 'valori\s+negativi\s+.{0,40}(profondit|sotto)'
positive_down_patterns:
  - 'positive\s+downwards?'
  - 'negative\s+upwards?'
  - '(depths?|values?)\s+(are|is)\s+(given|shown|expressed|presented|recorded)?\s*as\s+positive'
  - 'positive\s+(values?|numbers?)\s+(denote|indicate|represent|are|mean)\s+(the\s+)?(depths?|below)'
  - 'nach\s+unten\s+positiv'
  - 'positi(f|ve)s?\s+vers\s+le\s+bas'
  - 'positiv[oa]s?\s+hacia\s+abajo'
  - 'positiv[oa]s?\s+para\s+baixo'
