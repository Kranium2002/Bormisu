# Candidate coordinate systems for printed coordinates without a stated system, and the printed names
# (aliases) that state a system. Areas of use come from the EPSG database through pyproj, so only codes
# and names live here. Generic, worldwide; extend by adding entries, never by adding code branches.
# kind: geographic (degrees) or projected (metres).
# west_orientated: true for a system whose printed easting grows westward while its EPSG definition is an
# east-orientated reconstruction (Danish System 34): app.geo.plotting.to_wgs84 negates the printed easting
# (after any axis swap) for every reading, stated, ranked or confirmed alike.
# Printed names that carry more words than an alias ("NZTM2000 (NZGD2000)", "Koordinatsystem S34S") are read
# by the named systems of crs_patterns.yaml.
systems:
  - { code: "EPSG:4326",  kind: geographic, label: "WGS 84 (degrees)",                 aliases: ["WGS84", "WGS 84", "GPS", "lat/long", "decimal degrees"] }
  - { code: "EPSG:4258",  kind: geographic, label: "ETRS89 (degrees)",                 aliases: ["ETRS89 geographic"] }
