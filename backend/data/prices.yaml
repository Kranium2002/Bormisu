# Prices used to log the cost of provider calls when the provider does not report one itself.
# USD per million tokens (input/output) or per 1,000 OCR pages. Checked 2026-10-16; budget at regular prices.
# Unknown models are logged with cost 0 and a warning, never guessed.
models:
  # OpenRouter list price (models API, checked 2026-10-17); OpenRouter reports the cost of each call, this
  # entry prices budget estimates and a call whose answer carried no cost. Reasoning tokens bill as output.
  google/gemini-3.5-flash: { input_per_million: 1.50, output_per_million: 9.00 }
  # The same model on Google's own OpenAI-compatible endpoint (bare model id), at the list price OpenRouter
  # passes through; Google reports no cost per call.
  gemini-3.5-flash: { input_per_million: 1.50, output_per_million: 9.00 }
  mistralai/mistral-small-2603: { input_per_million: 0.15, output_per_million: 0.60 }
  # Mistral direct (the API reports no cost): conservative list prices of the models the aliases name
  mistral-small-latest: { input_per_million: 0.15, output_per_million: 0.60 }
  mistral-medium-latest: { input_per_million: 1.50, output_per_million: 7.50 }
  mistral-large-latest: { input_per_million: 2.00, output_per_million: 6.00 }
  mistralai/mistral-large-4-0: { input_per_million: 1.36, output_per_million: 4.18 }
  mistralai/mistral-medium-3.1: { input_per_million: 0.40, output_per_million: 2.00 }
  gpt-6.1-sol: { input_per_million: 2.0, output_per_million: 10.0 }
  qwen/qwen3-embedding-8b: { input_per_million: 0.01, output_per_million: 0.0 }
ocr:
  mistral-ocr-latest: { per_thousand_pages: 4.0 }
  default: { per_thousand_pages: 4.0 }
