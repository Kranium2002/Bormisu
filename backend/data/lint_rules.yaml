# Lint rules: severity and message per rule id. Detection lives in app/validate/rules.py (one function
# per rule, unit-tested) and, for rules that compare the boreholes of one document, in
# app/validate/document.py. Messages may use {placeholders} filled by the rule. An error with
# `unplot: true` keeps the borehole off the map with unplotted_reason `implausible`.
tolerance_m: 0.005
rules:
  layer_inverted:
    severity: error
    message: "Layer ends at {to} m but starts at {from_} m."
  layer_gap:
    severity: warning
    message: "Gap of {size} m between layer {prev} and layer {next}."
  layer_overlap:
    severity: error
    message: "Layer {next} starts {size} m above the end of layer {prev}."
  last_layer_beyond_total_depth:
    severity: error
    message: "The last layer ends at {to} m, below the total depth of {depth} m."
  last_layer_short_of_total_depth:
    severity: warning
    message: "The last layer ends at {to} m, above the total depth of {depth} m."
  spt_below_total_depth:
    severity: warning
    message: "SPT at {spt} m lies below the total depth of {depth} m."
  groundwater_below_total_depth:
    severity: warning
    message: "Groundwater at {gw} m lies below the total depth of {depth} m."
  rqd_above_100:
    severity: error
    limit: 100
    message: "RQD of {value} % is above {limit} % (kept as printed)."
  recovery_above_100:
    severity: error
    limit: 100
    message: "Core recovery of {value} % is above {limit} % (kept as printed)."
  ucs_above_300:
    severity: warning
    limit: 300
    units: ["", "mpa"]
    test_names: ["UCS"]
    message: "UCS of {value} MPa is above {limit} MPa; check the unit."
  cai_above_6_5:
    severity: warning
    limit: 6.5
    test_names: ["CAI"]
    message: "CAI of {value} is above {limit}; check the reading."
  spt_refusal_with_n:
    severity: error
    message: "SPT is marked as refusal but has an N value of {value}."
  coordinates_out_of_range:
    severity: error
    unplot: true
    message: "Latitude {lat} / longitude {lon} is outside WGS84 bounds."
  coordinates_zero:
    severity: error
    unplot: true
    message: "Latitude 0 / longitude 0 is a placeholder, not a position."
  sample_below_total_depth:
    severity: warning
    message: "Sample {name} at {value} m lies below the total depth of {depth} m."
  # Rules across the boreholes of one document. Stored in boreholes.document_lint and recomputed for the
  # whole document whenever one of its boreholes changes and when the document is finalised.
  coordinates_far_from_cluster:
    severity: error
    unplot: true
    # A document has a cluster once this many of its boreholes have a WGS84 position.
    min_points: 3
    # A position is implausible when it lies farther than max(min_distance_km, median_factor x the median
    # distance of the document's positions to their robust centre) from that centre AND from every other
    # position, so a second site with several boreholes is never an outlier.
    min_distance_km: 25
    median_factor: 20
    # ... but never more than this: a position farther than max_distance_km from the centre and from every
    # other position is implausible however spread out the others are (a misread digit, not a second site).
    max_distance_km: 100
    # More outliers than this share of the positions: no clear cluster, nothing is flagged.
    max_outlier_share: 0.34
    message: "This position lies {distance} km from the other boreholes of the document (typical spread {spread} km); check the printed coordinates and the coordinate system."
  coordinates_shared:
    severity: warning
    # Coordinates are identical when equal after rounding to this many decimals (in the printed system).
    decimals: 6
    message: "Borehole {others} of the same document has identical coordinates."
  duplicate_borehole:
    severity: warning
    message: "Same borehole as {label} in {file} (a person confirmed the duplicate)."
