# Page roles from the classifier -> coarse Page.type for the UI legend, and the plain reason shown when
# a page does not feed extraction. Generic for every standard and language; no document is named here.
roles:
  log_sheet:        { type: log }
  log_continuation: { type: log }
  summary_table:    { type: lab_table }
  coordinate_table: { type: lab_table }
  lab_results:      { type: lab_table }
  legend_or_key:    { type: text,    unused_reason: "legend or key" }
  narrative:        { type: text,    unused_reason: "narrative text" }
  cover_or_toc:     { type: text,    unused_reason: "cover or contents page" }
  location_plan:    { type: drawing, unused_reason: "location plan" }
  cross_section:    { type: drawing, unused_reason: "cross-section drawing" }
  photos:           { type: photo,   unused_reason: "photo page" }
  blank:            { type: unknown, unused_reason: "blank page" }
  duplicate:        { type: unknown, unused_reason: "duplicate of {file} p. {n}" }
  other:            { type: unknown, unused_reason: "no borehole data found" }
# Type of a page that has not been classified yet.
unclassified_type: unknown
# A page with almost no ink and no embedded text is blank without asking the classifier (no paid call):
# the share of dark pixels on a small grey render, and the most embedded characters it may hold.
blank_page: { max_ink_share: 0.001, dark_below: 200, max_text_chars: 8 }   # faint handwriting measures ~6 % below 200
# A word for "borehole" followed by a number sign is not part of the label: "BORING NO. T01" groups with
# "T01", "Bohrung Nr. 3" with "3". Without a number sign nothing is removed ("BH 1" stays "BH 1").
# Compared without case; generic for every language, no document is named here.
label_prefixes:
  words: [borehole, bore hole, boring, hole, bh, b.h., drillhole, drill hole, sondage, sondeo, sondaggio,
          bohrung, bohrloch, perforación, perforacion, perfuração, perfuracao, furo, boorgat, boring nr,
          borhull, borhål, borehul, sonda, hull, id, punkt, pkt]
  number_signs: ["no.", "no", "nr.", "nr", "n°", "nº", "n.", "#", "number", "núm.", "núm", "num.", "nummer"]
# Archive and registry stamps on a page ("Archiv 8016/924", "Registratur", "Aktenzeichen ..."): their numbers
# file the record, they never name a borehole (app.pipeline.group). A page label that contains one of these
# words, or whose number follows one of them in the page's text, or a bare number equal to a number in the
# document's file name, is not a borehole label when the page names another one.
archive_stamp_words: [archiv, archive, archives, archivnummer, archiv-nr, archiv nr, registratur, registry,
                      register-nr, aktenzeichen, akte, file no, file number, archive no, archive number,
                      dossier, n° d'archive, archivo, arquivo]
# Second opinion on a classifier outlier (app.pipeline.classify.second_opinion): a page put in a role that
# feeds no extraction although it looks like the log sheets around it (a log neighbour of the same page
# size, and handwriting or log sheets on both sides) is labelled again with the extractor model. At most
# `max_share` of the document's pages (at least one) and `max_pages` per document; sizes match within
# `size_tolerance` (share of the side).
second_opinion: { max_share: 0.1, max_pages: 10, size_tolerance: 0.02, roles: [log_sheet, log_continuation],
                  handwriting: [partial, full], skip_roles: [blank, duplicate] }
