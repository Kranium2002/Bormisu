[project]
name = "geomemory-backend"
version = "0.1.0"
description = "GeoMemory backend: borehole reports uploaded at runtime become a reviewed PostGIS database."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.30,<1",
    "geoalchemy2>=0.15,<1",
    "alembic>=1.13,<2",
    "procrastinate>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "python-ulid>=3.0,<4",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "pypdfium2>=4.30,<6",
    "pyproj>=3.7,<4",
    "pyyaml>=6.0,<7",
    "openai>=1.50,<3",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "hypothesis>=6.112,<7",
    "jsonschema[format-nongpl]>=4.23,<5",
    "referencing>=0.35",
    "ruff>=0.7,<1",
    "mypy>=1.13,<3",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# The prototype test from arav/dev needs a git-ignored cache; it is not part of this package.
addopts = "-ra --ignore=tests/test_api_and_schemas.py"
markers = [
    "db: needs PostgreSQL with PostGIS (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["api", "extractor", "models", "reference", "tests/test_api_and_schemas.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF012"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.normalize.*", "app.pipeline.*", "app.chat.*"]
strict = true
