# nginx server for the web image (frontend/Dockerfile): the single-page app plus the /api proxy.
#
# This file is a template of the official nginx image: at container start, envsubst fills in the
# environment variables API_UPSTREAM and API_RESOLVER (only those two, see NGINX_ENVSUBST_FILTER in
# the Dockerfile) and writes the result to /etc/nginx/conf.d/default.conf, inside the http block.
# Defaults: API_UPSTREAM=http://api:8000 (scheme, host and port only, no path and no trailing
# slash, so request URIs pass unchanged) and API_RESOLVER=127.0.0.11 (Docker's embedded DNS).
# nginx's own variables ($uri, $host …) are lower case and left alone.

server_tokens off;

# The API host is resolved per request, not at start: nginx starts and serves the app while the
# API is down, and /api answers 502, which the app shows as "backend unreachable".
resolver ${API_RESOLVER} valid=10s ipv6=off;
resolver_timeout 5s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
# text/html is always compressed.
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/geo+json application/manifest+json image/svg+xml;

# Hashed build files never change; everything else (index.html, the SPA fallback, public files)
# is revalidated, so a new image takes effect on reload. API responses keep their own headers.
map $uri $static_cache_control {
    ~^/api/      "";
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $static_cache_control;
    add_header X-Content-Type-Options nosniff always;
    # Tile servers such as OpenStreetMap require a referrer; no CSP because the tile host is configurable.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # A request body over a client_max_body_size limit gets the API's own error shape.
    error_page 413 @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"File larger than the upload limit (200 MB).","code":"too_large"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: a missing file is a 404, never the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes (/map, /review/bh_…) load the app shell.
    location / {
        try_files $uri /index.html;
    }

    # The API. A variable in proxy_pass makes nginx resolve the host per request; without a path in
    # it, the request URI and query string are passed exactly as the client sent them. Host is the
    # one the browser used (port included), so URLs the API builds point back through this proxy.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend's MAX_UPLOAD_MB (200) plus 1 MB for the multipart framing around the file, the
        # slack the backend allows too: a file just under the limit must reach the API, whose own
        # check answers anything larger with its JSON 413.
        client_max_body_size 201m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Live events (SSE): every frame goes to the browser at once, and the stream stays open.
    location /api/v1/events {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
    }

    # Chat stream (AI SDK UI message stream over SSE): same as the events.
    location /api/v1/chat {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
        # The request carries the conversation so far.
        client_max_body_size 10m;
    }
}
