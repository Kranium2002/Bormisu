# Frontend CI: unit tests, generated API types, production build (no sample data), Playwright
# smoke tests in sample mode, and the web image built from the repository root.
name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - 'assets/din4023_patterns/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - 'assets/din4023_patterns/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generated API types match contracts/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/data/api-types.gen.ts

      - name: Unit tests
        run: npm test

      - name: Build (API mode)
        run: npm run build

      - name: No sample data in the build
        run: npm run check:dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e (sample mode, bundled Chromium)
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: web image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: docker build (repository root as context)
        run: docker build -f frontend/Dockerfile -t bormisu-web:ci .
